<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ec">
  <title>Join · Qwestions</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/student.js" defer></script>
</head>
<body class="student-page">
  <header class="topbar student-topbar"><a class="brand" href="#"><span class="brand-mark">Q</span><span>qwestions</span></a><span class="top-note">Classroom responses</span></header>
  <main class="student-shell">
    <section class="student-card">
      <p class="eyebrow">JOINING CLASS</p>
      <h1 id="student-session">Loading class…</h1>
      <div id="identity-panel" class="identity-panel hidden">
        <label class="field-label" for="student-name">Your name</label>
        <div class="student-name-row"><input id="student-name" maxlength="80" autocomplete="name" placeholder="First and last name"><button id="join-button" class="button button-accent">Join</button></div>
        <p class="hint">Your name helps your teacher see who answered.</p>
        <p id="join-error" class="form-message" role="alert"></p>
      </div>
      <div id="waiting-panel" class="waiting-panel hidden"><span class="waiting-icon">◷</span><h2>You're in.</h2><p>There isn’t a question open right now. This page will update when your teacher opens one.</p><div class="student-name-badge"><span id="signed-in-name"></span><button id="change-name" class="text-button">Change</button></div></div>
      <div id="question-panel" class="student-question hidden"></div>
      <p id="student-error" class="student-error hidden" role="alert"></p>
    </section>
    <p class="student-footer">Answers go straight to your teacher’s device.</p>
  </main>
</body>
</html>
